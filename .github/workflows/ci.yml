name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  POSTGRESQL_VERSION: "=18.3.0"

jobs:
  check:
    strategy:
      matrix:
        rust: [stable, beta]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal
          rustup component add rustfmt clippy --toolchain ${{ matrix.rust }}
          rustup default ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      # Pre-carga el tar.gz de PostgreSQL en la ruta de caché que usa el
      # build-script de postgresql_embedded (~/.theseus según USERPROFILE);
      # con POSTGRESQL_VERSION="=18.3.0" (exacta) el script usa la caché y
      # evita llamar a la API de GitHub (rate limit / 504) en cada compilación.
      - name: Pre-descargar PostgreSQL embebido (caché build)
        shell: pwsh
        run: |
          $cacheTgz = Join-Path $env:USERPROFILE ".theseus\postgresql\postgresql-18.3.0-x86_64-pc-windows-msvc.tar.gz"
          if (-not (Test-Path $cacheTgz)) {
            New-Item -ItemType Directory -Path (Split-Path $cacheTgz) -Force | Out-Null
            Invoke-WebRequest -Uri "https://github.com/theseus-rs/postgresql-binaries/releases/download/18.3.0/postgresql-18.3.0-x86_64-pc-windows-msvc.tar.gz" -OutFile $cacheTgz
          }

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy common
        run: cargo clippy -p workshop-common -- -D warnings

      - name: Clippy server
        run: cargo clippy -p workshop-server -- -D warnings

      - name: Clippy viewer
        run: cargo clippy -p workshop-viewer -- -D warnings

      - name: Build server
        run: cargo build -p workshop-server

      - name: Build viewer
        run: cargo build -p workshop-viewer

      - name: Test server
        run: cargo test -p workshop-server

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Security audit
        run: cargo audit
        continue-on-error: true

  # Linux x86_64 — verifica que el server compile en Ubuntu
  check-linux-x64:
    runs-on: ubuntu-22.04
    env:
      POSTGRESQL_VERSION: "=18.3.0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Pre-descargar PostgreSQL embebido (caché build x86_64)
        run: |
          mkdir -p ~/.theseus/postgresql
          curl -fL -o ~/.theseus/postgresql/postgresql-18.3.0-x86_64-unknown-linux-gnu.tar.gz \
            https://github.com/theseus-rs/postgresql-binaries/releases/download/18.3.0/postgresql-18.3.0-x86_64-unknown-linux-gnu.tar.gz

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy common
        run: cargo clippy -p workshop-common -- -D warnings

      - name: Clippy server
        run: cargo clippy -p workshop-server -- -D warnings

      - name: Build server
        run: cargo build -p workshop-server

      - name: Test server
        run: cargo test -p workshop-server

  # Linux ARM64 — verifica que el server compile en Ubuntu ARM
  check-linux-arm64:
    runs-on: ubuntu-22.04-arm
    env:
      POSTGRESQL_VERSION: "=18.3.0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Pre-descargar PostgreSQL embebido (caché build aarch64)
        run: |
          mkdir -p ~/.theseus/postgresql
          curl -fL -o ~/.theseus/postgresql/postgresql-18.3.0-aarch64-unknown-linux-gnu.tar.gz \
            https://github.com/theseus-rs/postgresql-binaries/releases/download/18.3.0/postgresql-18.3.0-aarch64-unknown-linux-gnu.tar.gz

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy common
        run: cargo clippy -p workshop-common -- -D warnings

      - name: Clippy server
        run: cargo clippy -p workshop-server -- -D warnings

      - name: Build server
        run: cargo build -p workshop-server

      - name: Test server
        run: cargo test -p workshop-server