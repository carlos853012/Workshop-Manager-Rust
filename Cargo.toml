[workspace]
members = [
    "crates/inventory-common",
    "crates/inventory-server",
    "crates/inventory-viewer"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["WorkshopManager <contact@workshopmanager.com>"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

# Forzamos la configuración global de tray-icon para que en este workspace
# no busque bajo ningún concepto inicializar cosas de GTK/Linux.
[workspace.dependencies]
tray-icon = { version = "0.14", default-features = false, features = [] }
