[package]
name = "inventory-viewer"
version.workspace = true
edition.workspace = true

[[bin]]
name = "inventory-viewer"
path = "src/main.rs"

[dependencies]
inventory-common = { path = "../inventory-common" }
dioxus = { version = "0.6", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
