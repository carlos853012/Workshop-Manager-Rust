[package]
name = "inventory-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "inventory-server"
path = "src/main.rs"

[dependencies]
inventory-common = { path = "../inventory-common" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }
postgresql_embedded = { version = "0.20", features = ["bundled", "rustls"] }
flate2 = "1.0"
rcgen = "0.13"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.0"
rust_decimal = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
argon2 = "0.5"
jsonwebtoken = "9"
aes-gcm = "0.10"
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
obfstr = "0.4"
anyhow = "1.0"
regex = "1"
thiserror = "1.0"
genpdf = "0.2"

[target.'cfg(windows)'.dependencies]
tao = "0.30"
tray-icon = "0.19"
winreg = "0.52"
clipboard-win = "5.4"
