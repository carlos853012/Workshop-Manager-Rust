[colors]
background = "#1E2126"
surface = "#2a2d33"
surface_hover = "#3a3d44"
border = "#3a3d44"
text = "#F5F3F0"
text_muted = "#9ca3af"
primary = "#F59E0B"
primary_hover = "#D97706"
primary_text = "#ffffff"
danger = "#DC2626"
danger_hover = "#B91C1C"
warning = "#EAB308"
success = "#16A34A"
info = "#475569"
nav_bg = "#1E2126"
nav_text = "#e5e7eb"
nav_text_muted = "#9ca3af"
nav_hover = "#2a2d33"
icon_bg = "#F59E0B"
icon_fg = "#1E2126"

[typography]
font_family = "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
font_size_sm = "0.875rem"
font_size_base = "1rem"
font_size_lg = "1.125rem"
font_size_xl = "1.25rem"
font_size_2xl = "1.5rem"
line_height = "1.5"

[spacing]
xs = "0.25rem"
sm = "0.5rem"
md = "1rem"
lg = "1.5rem"
xl = "2rem"
xxl = "3rem"

[radii]
sm = "0.25rem"
md = "0.5rem"
lg = "0.75rem"
full = "9999px"

[shadows]
sm = "0 1px 2px 0 rgba(0, 0, 0, 0.3)"
md = "0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.4)"
lg = "0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -4px rgba(0, 0, 0, 0.4)"
