[package]
name = "inventory-common"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["postgres", "chrono", "uuid", "rust_decimal"] }
rust_decimal = { version = "1.0", features = ["serde-with-str"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
ed25519-dalek = "2.1"
sha2 = "0.10"
resvg = { version = "0.48", default-features = false }
