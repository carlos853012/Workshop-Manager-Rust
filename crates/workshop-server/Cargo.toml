[package]
name = "workshop-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "workshop-server"
path = "src/main.rs"

[dependencies]
workshop-common = { path = "../workshop-common" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate"] }
postgresql_embedded = { version = "0.20", features = ["bundled", "rustls"] }
flate2 = "1.0"
rcgen = "0.13"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.0"
rust_decimal = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
argon2 = "0.5"
jsonwebtoken = "9"
aes-gcm = "0.10"
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
anyhow = "1.0"
regex = "1"
thiserror = "1.0"
genpdf = "0.2"
local-ip-address = "0.6"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[target.'cfg(windows)'.dependencies]
tao = "0.30"
tray-icon = "0.19"
winreg = "0.52"
clipboard-win = "5.4"
native-windows-gui = "1.0"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.wix]
name = "WorkshopManagerServer"
upgrade-guid = "B8A2C4D6-E1F3-5A7B-9C0D-2E4F6A8B0C2D"
path-guid = "C9B3D5E7-F2A4-6B8C-0D1E-3F5A7B9C1D3E"
eula = false

[package.metadata.deb]
name = "workshop-server"
maintainer = "WorkshopManager <contact@workshopmanager.com>"
copyright = "2026 WorkshopManager"
extended-description = "WorkshopManager — Servidor de gestión de taller mecánico. Incluye PostgreSQL embebido, TLS, autenticación JWT y backup automático."
section = "utils"
priority = "optional"
depends = []
assets = [
    ["target/release/workshop-server", "usr/bin/workshop-server", "755"],
]
maintainer-scripts = "debian/"
